<!doctype html>
<html lang="fr">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espagne.ma | Immigration premium vers l'Espagne</title>
    <style>
      :root {
        --bg: #070b1a;
        --bg-soft: #111932;
        --card: rgba(17, 25, 50, 0.75);
        --line: rgba(255, 255, 255, 0.14);
        --gold: #e7bc65;
        --gold-soft: #f7dca6;
        --text: #f6f8ff;
        --muted: #bcc6e2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, Segoe UI, Roboto, system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 20% 0%, #203468 0%, var(--bg) 45%), var(--bg);
        min-height: 100vh;
      }

      .container {
        width: min(1120px, 92%);
        margin: 0 auto;
      }

      header {
        position: sticky;
        top: 0;
        backdrop-filter: blur(8px);
        background: rgba(7, 11, 26, 0.75);
        border-bottom: 1px solid var(--line);
        z-index: 10;
      }

      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.9rem 0;
        gap: 1rem;
      }

      .brand {
        font-weight: 800;
        letter-spacing: 0.03em;
      }

      .brand span {
        color: var(--gold);
      }

      .language-switcher {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .language-switcher button {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.4rem 0.85rem;
        cursor: pointer;
      }

      .language-switcher button.active {
        border-color: var(--gold);
        color: #1b1f33;
        background: linear-gradient(140deg, var(--gold) 0%, var(--gold-soft) 100%);
        font-weight: 700;
      }

      .hero {
        padding: 5rem 0 3rem;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 2rem;
      }

      .hero-card,
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 1.6rem;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(1.7rem, 4.5vw, 3rem);
        line-height: 1.15;
      }

      .subtitle {
        color: var(--muted);
        font-size: 1.07rem;
      }

      .cta-row {
        margin-top: 1.5rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.8rem 1.1rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        border: 1px solid var(--line);
      }

      .button.primary {
        border-color: transparent;
        color: #101321;
        background: linear-gradient(140deg, var(--gold) 0%, var(--gold-soft) 100%);
      }

      .button.secondary {
        color: var(--text);
      }

      .stat-list {
        list-style: none;
        margin: 1rem 0 0;
        padding: 0;
        display: grid;
        gap: 0.8rem;
      }

      .stat-list li {
        padding: 0.75rem;
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .section-title {
        margin: 0 0 1rem;
        font-size: clamp(1.4rem, 3.8vw, 2.2rem);
      }

      .residency-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }

      .residency-card {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 14px;
        padding: 1rem;
      }

      .residency-card h3 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }

      .residency-card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.93rem;
      }

      .process {
        margin: 2rem 0 4rem;
      }

      .steps {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
      }

      .step {
        padding: 1rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
      }

      .step strong {
        color: var(--gold-soft);
      }

      footer {
        padding: 2rem 0 3rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        text-align: center;
      }

      .arabic {
        direction: rtl;
        text-align: right;
        font-family: "Tajawal", "Noto Naskh Arabic", Arial, sans-serif;
      }

      @media (max-width: 920px) {
        .hero-grid,
        .residency-grid,
        .steps {
          grid-template-columns: 1fr;
        }
      }
    </style>

      const grid = document.getElementById("residencyGrid");

      function render(lang) {
        const data = content[lang];
        document.documentElement.lang = lang;
        document.body.classList.toggle("arabic", lang === "ar");

        fields.forEach((field) => {
          const key = field.getAttribute("data-i18n");
          field.textContent = data[key];
        });

        grid.innerHTML = "";
        data.residencies.forEach(([name, description]) => {
          const card = document.createElement("article");
          card.className = "residency-card";
          card.innerHTML = `<h3>${name}</h3><p>${description}</p>`;
          grid.appendChild(card);
        });
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          buttons.forEach((b) => b.classList.remove("active"));
          button.classList.add("active");
          render(button.dataset.lang);
        });
      });
